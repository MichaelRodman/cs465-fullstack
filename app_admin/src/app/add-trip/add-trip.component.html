<div class="container">
  <div class="row">
    <div class="col-md-8">
      <h1>Add Trip</h1>

      <form [formGroup]="addForm" (ngSubmit)="onSubmit()">

        <div class="mb-3">
          <label for="code" class="form-label">Trip Code</label>
          <input
            type="text"
            id="code"
            class="form-control"
            formControlName="code"
          >
        </div>

        <div class="mb-3">
          <label for="name" class="form-label">Trip Name</label>
          <input
            type="text"
            id="name"
            class="form-control"
            formControlName="name"
          >
        </div>

        <div class="mb-3">
          <label for="length" class="form-label">Length</label>
          <input
            type="text"
            id="length"
            class="form-control"
            formControlName="length"
          >
        </div>

        <div class="mb-3">
          <label for="start" class="form-label">Start Date</label>
          <input
            type="date"
            id="start"
            class="form-control"
            formControlName="start"
          >
        </div>

        <div class="mb-3">
          <label for="resort" class="form-label">Resort</label>
          <input
            type="text"
            id="resort"
            class="form-control"
            formControlName="resort"
          >
        </div>

        <div class="mb-3">
          <label for="perPerson" class="form-label">Price Per Person</label>
          <input
            type="text"
            id="perPerson"
            class="form-control"
            formControlName="perPerson"
          >
        </div>

        <div class="mb-3">
          <label for="image" class="form-label">Image</label>
          <input
            type="text"
            id="image"
            class="form-control"
            formControlName="image"
          >
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea
            id="description"
            class="form-control"
            rows="5"
            formControlName="description"
          ></textarea>
        </div>

        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="addForm.invalid"
        >
          Add Trip
        </button>

      </form>
    </div>
  </div>
</div>
