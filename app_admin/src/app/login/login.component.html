<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h2>Admin Login</h2>

      <div
        *ngIf="formError"
        class="alert alert-danger"
        role="alert">
        {{ formError }}
      </div>

      <form (ngSubmit)="onLoginSubmit()">
        <div class="mb-3">
          <label for="email" class="form-label">
            Email
          </label>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            [(ngModel)]="credentials.email"
            required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">
            Password
          </label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            [(ngModel)]="credentials.password"
            required>
        </div>

        <button
          type="submit"
          class="btn btn-primary">
          Log In
        </button>
      </form>
    </div>
  </div>
</div>
